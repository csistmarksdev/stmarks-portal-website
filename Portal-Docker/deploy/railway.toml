# Railway — build the Portal from this repository.
#
# Railway reads this from the *repository root* (or from a service's configured
# root directory), so copy it there before connecting the repo:
#
#     cp Portal-Docker/deploy/railway.toml ./railway.toml
#
# Then, once the service exists, two things have to be done in the dashboard
# because they are not expressible in this file:
#
#   1. Settings -> Volumes: add a volume mounted at `/data`. Without it the
#      bundled MongoDB writes into the container's own layer and the parish's
#      edits vanish on the next deploy — the portal comes back as the snapshot.
#   2. Variables: `UPLOAD_DIR=/data/uploads`, so uploaded media lands inside
#      that same volume instead of beside the application. One mount then
#      covers everything that must survive.
#
# Nothing else is required. Railway injects `PORT` and `RAILWAY_PUBLIC_DOMAIN`;
# the entrypoint reads both, so the public origin is right on the first deploy
# and the JWT secrets are generated into the volume on first boot.
#
# Prefer the published image
# --------------------------
# `dockerfilePath` below points at `Dockerfile.source`, which compiles inside
# Railway's builder — several minutes and ~2 GB of RAM on every push. That is
# the only option when building from the repository, because `Dockerfile` copies
# `dist-portal/` and that folder is generated rather than committed.
#
# Deploying the published image instead skips the build entirely (Service ->
# Settings -> Source -> Docker Image), and is what this layout is for:
#
#     cd Portal-Docker
#     ./scripts/build-image.sh --push you/csistmarkscmsportal:1.5

[build]
builder = "DOCKERFILE"
dockerfilePath = "Portal-Docker/Dockerfile.source"

[deploy]
# The first boot restores 577 documents and 376 media files before anything
# listens. A shorter timeout here marks a container unhealthy while it is doing
# exactly what it was told to, and Railway then restarts it — forever.
healthcheckPath = "/v1/health"
healthcheckTimeout = 300

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# One instance, and this is not a tuning choice. The container runs its own
# MongoDB against a single volume; a second replica would attach a second
# `mongod` to storage that allows exactly one writer, and the second one dies
# on the lock file.
numReplicas = 1
